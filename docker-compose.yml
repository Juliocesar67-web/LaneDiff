version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: league_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Juliocesar67!?
      POSTGRES_DB: lanediff
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: admin_page
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
